[pytest]
# OptoDrum Connector test suite configuration.
#
# Coverage scope: the processing engine (steps/optodrum/optodrum.py) plus
# a GUI construction smoke test. There is no statistics/plots engine here
# to test, since this app has exactly one job.

minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

addopts =
    -ra
    --strict-markers
    --tb=short
